<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receipt</title>

<style>
body {
  background: #eee;
  display: flex;
  justify-content: center;
  padding: 20px;
}

/* Receipt paper */
#receipt {
  background: white;
  width: 300px;
  padding: 20px;
  font-family: "Courier New", monospace;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

/* Centered header */
.center {
  text-align: center;
}

/* Divider */
.line {
  border-top: 1px dashed black;
  margin: 10px 0;
}

/* Row formatting */
.row {
  display: flex;
  justify-content: space-between;
}

</style>
</head>

<body>

<div id="receipt"></div>

<script>
const params = new URLSearchParams(window.location.search);
let encoded = params.get("data");

let output = "";

if (encoded) {
  try {
    const data = JSON.parse(atob(encoded));

    output += `<div class="center">`;
    output += `<strong>VENDING MACHINE</strong><br>`;
    output += `</div>`;

    output += `<div class="line"></div>`;

    output += `<strong>Items Purchased:</strong><br>`;

    for (let item in data.counts) {
      output += `<div class="row">
        <span>${item} x${data.counts[item]}</span>
        <span>$${(data.counts[item] * 1).toFixed(2)}</span>
      </div>`;
    }

    output += `<div class="line"></div>`;

    output += `<div class="row">
      <span>Total Items:</span>
      <span>${data.totalItems}</span>
    </div>`;

    output += `<div class="row">
      <span>Total Spent:</span>
      <span>$${data.spent}</span>
    </div>`;

    output += `<div class="row">
      <span>Change:</span>
      <span>$${data.balance}</span>
    </div>`;

    output += `<div class="line"></div>`;

    output += `<div class="center">THANK YOU!</div>`;

  } catch {
    output = "Invalid QR Code";
  }
}

document.getElementById("receipt").innerHTML = output;
</script>

</body>
</html>
