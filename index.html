<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Vending Machine</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
html, body {
  height: 100%;
  margin: 0;
}

body {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-family: Arial;
  text-align: center;
  transition: background 0.5s;
}

/* Blue background mode */
.active-mode {
  background-color: #9ED7E6;
}

/* Screens */
#home, #menu, #qrScreen {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#menu, #qrScreen {
  display: none;
}

/* Zoom animation */
.zoom-in {
  animation: zoomIn 0.5s ease forwards;
}

@keyframes zoomIn {
  from {
    transform: scale(0.6);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

/* Machine */
#machine {
  width: 80vw;
  max-width: 400px;
  cursor: pointer;
}

/* Items (NOW WHITE BOXES) */
.item {
  width: 80%;
  max-width: 400px;
  margin: 10px auto;
  padding: 15px;
  border: 1px solid black;
  background-color: white;
  border-radius: 10px;
  cursor: pointer;
  font-size: clamp(16px, 3vw, 28px);
  transition: transform 0.15s, background-color 0.3s;
}

.item:hover {
  transform: scale(1.05);
}

.clicked {
  background-color: lightgreen;
}

/* Text */
#balanceBox, #output {
  font-size: clamp(18px, 3vw, 28px);
  margin: 10px;
  font-weight: bold;
}

/* Buttons */
button {
  font-size: clamp(16px, 3vw, 26px);
  padding: 10px 20px;
  margin: 5px;
  cursor: pointer;
}

/* QR container */
#qrcode {
  margin-top: 20px;
  transform: scale(2); /* 👈 doubled size */
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home">
  <h1>QR Vending Machine</h1>
  <img id="machine" src="https://i.ibb.co/JRm3wK06/Vending-Machine-Image.png">
</div>

<!-- MENU -->
<div id="menu">
  <div id="balanceBox">Balance: $0.00</div>

  <button onclick="addMoney(5)">Insert $5</button>

  <h2>Select Item</h2>

  <div class="item" onclick="buyItem(this, 'chips')">Chips - $1.50</div>
  <div class="item" onclick="buyItem(this, 'soda')">Soda - $2.00</div>
  <div class="item" onclick="buyItem(this, 'candy')">Candy - $1.25</div>

  <button onclick="finish()">Done</button>

  <div id="output"></div>
</div>

<!-- QR SCREEN -->
<div id="qrScreen">
  <h2>Scan Your QR Code</h2>
  <div id="qrcode"></div>
</div>

<script>
class VendingMachine {
  constructor() {
    this.prices = { chips: 1.50, soda: 2.00, candy: 1.25 };
    this.balance = 0;
    this.spent = 0;
    this.purchases = [];
  }

  addMoney(amount) {
    this.balance += amount;
  }

  buy(item) {
    const price = this.prices[item];
    if (this.balance < price) return false;

    this.balance -= price;
    this.spent += price;
    this.purchases.push(item);
    return true;
  }
}

const vm = new VendingMachine();

function updateBalance() {
  document.getElementById("balanceBox").innerText =
    `Balance: $${vm.balance.toFixed(2)}`;
}

/* OPEN MACHINE WITH ZOOM */
document.getElementById("machine").onclick = () => {
  document.body.classList.add("active-mode");

  document.getElementById("home").style.display = "none";

  let menu = document.getElementById("menu");
  menu.style.display = "flex";
  menu.classList.add("zoom-in");

  updateBalance();
};

function addMoney(amount) {
  vm.addMoney(amount);
  updateBalance();
}

function buyItem(el, item) {
  let success = vm.buy(item);

  if (!success) {
    el.style.backgroundColor = "red";
    setTimeout(() => el.style.backgroundColor = "white", 300);
    document.getElementById("output").innerText = "Not enough money";
    return;
  }

  el.classList.add("clicked");
  setTimeout(() => el.classList.remove("clicked"), 200);

  document.getElementById("output").innerText = "Added: " + item;
  updateBalance();
}

/* FINISH → QR ONLY */
function finish() {
  if (vm.purchases.length === 0) return;

  let counts = {};
  vm.purchases.forEach(item => {
    counts[item] = (counts[item] || 0) + 1;
  });

  const receipt = {
    counts: counts,
    totalItems: vm.purchases.length,
    balance: vm.balance.toFixed(2),
    spent: vm.spent.toFixed(2)
  };

  let encoded = btoa(JSON.stringify(receipt));

  let base = window.location.origin +
    window.location.pathname.substring(0, window.location.pathname.lastIndexOf("/") + 1);

  let finalURL = base + "receipt.html?data=" + encoded;

  // Switch screens
  document.getElementById("menu").style.display = "none";

  let qrScreen = document.getElementById("qrScreen");
  qrScreen.style.display = "flex";
  qrScreen.classList.add("zoom-in");

  // Generate QR
  document.getElementById("qrcode").innerHTML = "";
  new QRCode(document.getElementById("qrcode"), {
    text: finalURL,
    width: 200,
    height: 200
  });
}
</script>

</body>
</html>
